[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alr51/ondes"

[workspace.dependencies]
ondes-core = { path = "crates/core" }
ondes-audio = { path = "crates/audio" }
ondes-sources = { path = "crates/sources" }
ondes-radio = { path = "crates/radio" }
ondes-library = { path = "crates/library" }
# GPUI Kit embarque GPUI (`gpui-pre`) : version exacte, ne jamais ajouter `gpui` séparément.
gpui-kit = "=0.9.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "sync", "macros"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
flume = "0.12"
url = "2.5"
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
directories = "6"
# Déjà dans l'arbre via GPUI : réduction des logos avant mise en cache.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico", "bmp"] }
sha2 = "0.10"
lofty = "0.25"
rayon = "1.12"
walkdir = "2"
notify = "8"
fastrand = "2"
# Touches multimédia et MPRIS (Linux via zbus, sans libdbus), SMTC (Windows), macOS.
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
notify-rust = "4"
# HWND de la fenêtre GPUI, exigé par souvlaki pour SMTC sous Windows.
raw-window-handle = "0.6"
toml = "1"
# Déjà dans l'arbre via GPUI : heure locale des noms d'enregistrements.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "http2", "charset", "json", "query"] }
# Décodage via symphonia (MP3, AAC/MP4, FLAC, Vorbis, WAV) ; sortie via cpal.
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4", "flac", "vorbis", "wav"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
# Les dépendances (GPUI) compilées optimisées : l'UI reste fluide en debug.
opt-level = 2
