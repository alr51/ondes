[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ondes-core = { path = "crates/core" }
# GPUI Kit embarque GPUI (`gpui-pre`) : version exacte, ne jamais ajouter `gpui` séparément.
gpui-kit = "=0.9.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "sync", "macros"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[profile.dev.package."*"]
# Les dépendances (GPUI) compilées optimisées : l'UI reste fluide en debug.
opt-level = 2
