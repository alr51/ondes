name: Release

# Publie les paquets quand une étiquette `v*` est poussée (ex. `git tag v0.1.0 && git push --tags`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            formats: deb,appimage
          - os: macos-latest
            formats: dmg
          - os: windows-latest
            formats: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev pkg-config libfuse2
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked
      - run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: ondes-${{ runner.os }}
          path: |
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.dmg
            target/packages/*-setup.exe
          if-no-files-found: error
      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.dmg
            target/packages/*-setup.exe
